<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550" role="img">
  <title>BoilerIO architecture</title>
  <desc>Sensors reach an RFM2Pi board on a separate sensor hub, where emonhub publishes readings to an MQTT broker. The controller and Danfoss bridge run on a Raspberry Pi with Docker Compose and also connect to the broker. Logically, emonhub sends readings to the controller, and the controller exchanges boiler control messages with the Danfoss bridge. The controller syncs with the backend API, which the web UI, Home Assistant and Alexa use. The Danfoss bridge drives the Danfoss receiver through a JeeLink. The diagram flows left to right: sensors and sensor hub on the left, the Raspberry Pi in the middle, the boiler receiver on the right, with the clients and backend across the top.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
    .ts { font-size: 12px; fill: #5F5E5A; }
    .teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
    .teal .th { fill: #085041; }
    .teal .ts { fill: #0F6E56; }
    .gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
    .gray .th { fill: #444441; }
    .gray .ts { fill: #5F5E5A; }
    .zone { fill: none; stroke: #888780; stroke-width: 0.5; stroke-dasharray: 6 4; }
    .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
    .flow { stroke: #1D9E75; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="af" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1000" height="550" fill="#ffffff"/>

  <!-- Clients -->
  <g class="teal">
    <rect x="70" y="20" width="160" height="56" rx="8"/>
    <text class="th" x="150" y="40" text-anchor="middle" dominant-baseline="central">Web UI</text>
    <text class="ts" x="150" y="58" text-anchor="middle" dominant-baseline="central">boilerio-ui</text>
  </g>
  <g class="teal">
    <rect x="250" y="20" width="160" height="56" rx="8"/>
    <text class="th" x="330" y="40" text-anchor="middle" dominant-baseline="central">Home Assistant</text>
    <text class="ts" x="330" y="58" text-anchor="middle" dominant-baseline="central">Integration</text>
  </g>
  <g class="teal">
    <rect x="430" y="20" width="160" height="56" rx="8"/>
    <text class="th" x="510" y="40" text-anchor="middle" dominant-baseline="central">Alexa skill</text>
    <text class="ts" x="510" y="58" text-anchor="middle" dominant-baseline="central">Voice control</text>
  </g>

  <!-- Backend -->
  <rect class="zone" x="40" y="100" width="580" height="104" rx="12"/>
  <text class="ts" x="54" y="118">AWS, or your own network</text>
  <g class="teal">
    <rect x="250" y="132" width="160" height="56" rx="8"/>
    <text class="th" x="330" y="152" text-anchor="middle" dominant-baseline="central">Backend</text>
    <text class="ts" x="330" y="170" text-anchor="middle" dominant-baseline="central">REST API</text>
  </g>

  <line class="arr" x1="150" y1="78" x2="290" y2="130" marker-end="url(#ah)"/>
  <line class="arr" x1="330" y1="78" x2="330" y2="130" marker-end="url(#ah)"/>
  <line class="arr" x1="510" y1="78" x2="370" y2="130" marker-end="url(#ah)"/>

  <!-- Raspberry Pi -->
  <rect class="zone" x="205" y="240" width="600" height="190" rx="12"/>
  <text class="ts" x="791" y="258" text-anchor="end">Raspberry Pi (Docker Compose)</text>

  <!-- Sensor hub -->
  <rect class="zone" x="20" y="320" width="160" height="216" rx="12"/>
  <text class="ts" x="34" y="524">Sensor hub (e.g. emonPi)</text>
  <g class="teal">
    <rect x="245" y="270" width="170" height="56" rx="8"/>
    <text class="th" x="330" y="290" text-anchor="middle" dominant-baseline="central">controller</text>
    <text class="ts" x="330" y="308" text-anchor="middle" dominant-baseline="central">Schedule and PID control</text>
  </g>
  <line class="arr" x1="330" y1="268" x2="330" y2="190" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <!-- MQTT bus -->
  <g class="gray">
    <rect x="225" y="362" width="210" height="32" rx="8"/>
    <text class="th" x="330" y="378" text-anchor="middle" dominant-baseline="central">MQTT broker (e.g. Mosquitto)</text>
  </g>
  <line class="arr" x1="330" y1="328" x2="330" y2="360" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <g class="gray">
    <rect x="30" y="350" width="140" height="56" rx="8"/>
    <text class="th" x="100" y="370" text-anchor="middle" dominant-baseline="central">emonhub</text>
    <text class="ts" x="100" y="388" text-anchor="middle" dominant-baseline="central">Publishes readings</text>
  </g>
  <g class="teal">
    <rect x="470" y="350" width="140" height="56" rx="8"/>
    <text class="th" x="540" y="370" text-anchor="middle" dominant-baseline="central">Danfoss bridge</text>
    <text class="ts" x="540" y="388" text-anchor="middle" dominant-baseline="central">Relay bridge</text>
  </g>
  <line class="arr" x1="172" y1="378" x2="223" y2="378" marker-end="url(#ah)"/>
  <line class="arr" x1="437" y1="378" x2="468" y2="378" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <!-- Logical flows -->
  <path class="flow" d="M100 348 L100 298 L243 298" marker-end="url(#af)"/>
  <text class="ts" x="30" y="288">Sensor readings</text>
  <path class="flow" d="M417 298 L540 298 L540 348" marker-start="url(#af)" marker-end="url(#af)"/>
  <text class="ts" x="430" y="286">Boiler control</text>

  <!-- Receivers -->
  <g class="gray">
    <rect x="30" y="450" width="140" height="56" rx="8"/>
    <text class="th" x="100" y="470" text-anchor="middle" dominant-baseline="central">RFM2Pi board</text>
    <text class="ts" x="100" y="488" text-anchor="middle" dominant-baseline="central">Sensor RF receiver</text>
  </g>
  <g class="gray">
    <rect x="645" y="350" width="140" height="56" rx="8"/>
    <text class="th" x="715" y="370" text-anchor="middle" dominant-baseline="central">JeeLink</text>
    <text class="ts" x="715" y="388" text-anchor="middle" dominant-baseline="central">Custom firmware</text>
  </g>
  <line class="arr" x1="100" y1="448" x2="100" y2="408" marker-end="url(#ah)"/>
  <line class="arr" x1="612" y1="378" x2="643" y2="378" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <!-- External hardware -->
  <g class="gray">
    <rect x="225" y="450" width="140" height="56" rx="8"/>
    <text class="th" x="295" y="470" text-anchor="middle" dominant-baseline="central">EmonTH sensors</text>
    <text class="ts" x="295" y="488" text-anchor="middle" dominant-baseline="central">OpenEnergyMonitor</text>
  </g>
  <g class="gray">
    <rect x="840" y="350" width="140" height="56" rx="8"/>
    <text class="th" x="910" y="370" text-anchor="middle" dominant-baseline="central">Danfoss receiver</text>
    <text class="ts" x="910" y="388" text-anchor="middle" dominant-baseline="central">Controls the boiler</text>
  </g>
  <line class="arr" x1="223" y1="478" x2="172" y2="478" marker-end="url(#ah)"/>
  <line class="arr" x1="787" y1="378" x2="838" y2="378" marker-end="url(#ah)"/>

  <!-- Legend -->
  <g class="teal"><rect x="720" y="33" width="14" height="14" rx="4"/></g>
  <text class="ts" x="742" y="40" dominant-baseline="central">BoilerIO software</text>
  <g class="gray"><rect x="720" y="59" width="14" height="14" rx="4"/></g>
  <text class="ts" x="742" y="66" dominant-baseline="central">Hardware and third-party</text>
  <line class="flow" x1="720" y1="92" x2="734" y2="92"/>
  <text class="ts" x="742" y="92" dominant-baseline="central">Logical data flow</text>
</svg>
