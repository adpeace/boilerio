name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with PYTHON_VERSIONS in Makefile.
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.10"
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --extra test --python ${{ matrix.python-version }}
      - name: Run tests
        run: uv run --no-sync pytest
